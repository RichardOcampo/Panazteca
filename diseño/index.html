<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Panadería — Producto</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="top-bar">
    <span class="logo"><img src="img/logo.jpg" alt="Pan Azteca"></span>
    <span class="brand-name">Pan Azteca</span>
  </header>

  <!-- PRODUCT HERO SECTION (imagen dinámica según producto) -->
  <section class="product-hero">
    <img src="" alt="Foto del producto" id="product-image">
  </section>

  <div class="main-content">
    <!-- INFO DINÁMICA DEL PRODUCTO -->
    <section class="product-info">
      <h1 class="product-name" id="product-name">Nombre del producto</h1>
      <span class="product-category" id="product-category">Categoría: Pan Dulce</span>
      <p class="product-description" id="product-description">
        Descripción dinámica del producto: ingredientes principales, textura, sabor y por qué es especial.
      </p>

      <ul class="product-details" id="ingredientes-lista">
        <!-- los <li> de ingredientes se insertan aquí por JS -->
        <li class="precio" id="precio">$00.00</li>
      </ul>
    </section>

    <!-- CROSS-NAVIGATION: cambia el contenido de la misma página, no navega a otra URL -->
    <nav class="cross-nav" aria-label="Explora otras categorías">
      <h3>Explora nuestras otras opciones</h3>
      <div class="cross-nav-grid">
        <button class="cross-nav-card" data-category="Barra">
          <img src="img/pan2.webp" alt="Barra">
          Ver categoría 2: Barra
        </button>
        <button class="cross-nav-card" data-category="Galleta">
          <img src="img/pan3.webp" alt="Galleta">
          Ver categoría 3: Galleta
        </button>
      </div>
    </nav>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <footer>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <a href="#inicio" class="active">🏠<span>Inicio</span></a>
      <a href="productos.html">📖<span>Productos</span></a>
      <a href="informacion.html">ℹ️<span>Información</span></a>
    </nav>
    <div class="gesture-line"></div>
  </footer>

</div>

<script src="js/catalogo.js"></script>
<script src="js/main.js"></script>

</body>
</html>
