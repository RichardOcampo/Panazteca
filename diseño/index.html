<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Panadería — Producto</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="top-bar">
    <span class="logo"><img src="img/logo.jpg" alt="Pan Azteca"></span>
    <span class="brand-name">Pan Azteca</span>
  </header>

  <!-- PRODUCT HERO SECTION (imagen dinámica según producto) -->
  <section class="product-hero">
    <img src="" alt="Foto del producto" id="product-image">
  </section>

  <div class="main-content">
    <!-- INFO DINÁMICA DEL PRODUCTO -->
    <section class="product-info">
      <h1 class="product-name" id="product-name">Nombre del producto</h1>
      <span class="product-category" id="product-category">Categoría: Pan Dulce</span>
      <p class="product-description" id="product-description">
        Descripción dinámica del producto: ingredientes principales, textura, sabor y por qué es especial.
      </p>

      <ul class="product-details" id="ingredientes-lista">
        <!-- los <li> de ingredientes se insertan aquí por JS -->
        <li class="precio" id="precio">$00.00</li>
      </ul>
    </section>

    <!-- CROSS-NAVIGATION: cambia el contenido de la misma página, no navega a otra URL -->
    <nav class="cross-nav" aria-label="Explora otras categorías">
      <h3>Explora nuestras otras opciones</h3>
      <div class="cross-nav-grid">
        <button class="cross-nav-card" data-category="Barra">
          <img src="img/pan2.webp" alt="Barra">
          Ver categoría 2: Barra
        </button>
        <button class="cross-nav-card" data-category="Galleta">
          <img src="img/pan3.webp" alt="Galleta">
          Ver categoría 3: Galleta
        </button>
      </div>
    </nav>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <footer>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <a href="#inicio" class="active">🏠<span>Inicio</span></a>
      <a href="#productos">📖<span>Productos</span></a>
      <a href="#whatsapp">ℹ️<span>Información</span></a>
    </nav>
    <div class="gesture-line"></div>
  </footer>

</div>

<script>
  // ---------------------------------------------
  // 1. LOS DATOS: cada producto es un objeto simple.
  //    En producción esto vendría de una API o un JSON,
  //    pero para la plantilla basta con este arreglo.
  //    La LLAVE de cada producto (ej. "concha") ES su
  //    identificador único: el mismo que va en la URL
  //    y el que llevará impreso el código QR.
  // ---------------------------------------------
  const productos = {
    "Surtido": {
      nombre: "Pan de masa madre",
      categoria: "Surtido",
      descripcion: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean vel hendrerit nisi. In imperdiet urna non dui imperdiet aliquet. Vestibulum sagittis velit non dolor feugiat, eu rhoncus nibh posuere. Phasellus interdum et massa et mollis. Duis vel rutrum nisl. Etiam rutrum placerat erat a interdum. ",
      ingredientes: ["Harina de trigo", "Mantequilla", "Azúcar", "Vainilla"],
      imagen: "img/pan1.jfif"
    },
    "Barra": {
      nombre: "Bolillo Clásico",
      categoria: "Barra",
      descripcion: "Pan crujiente por fuera y suave por dentro, ideal para tortas o para acompañar cualquier comida.",
      ingredientes: ["Harina de trigo", "Sal", "Levadura", "Agua"],
      imagen: "img/pan2.webp"
    },
    "Galleta": {
      nombre: "Pastel de Chocolate",
      categoria: "Galleta",
      descripcion: "Rebanada húmeda de chocolate con relleno de ganache, perfecta para acompañar un café.",
      ingredientes: ["Chocolate amargo", "Huevo", "Azúcar", "Crema"],
      imagen: "img/pan3.webp"
    }
  };

  const PRODUCTO_POR_DEFECTO = "Surtido";
  const PARAM_URL = "producto"; // así se verá: pagina.html?producto=Surtido

  // Mapea cada botón de cross-nav a un producto "representante" de esa categoría
  const categoriaAProducto = {
    "Barra": "Barra",
    "Galleta": "Galleta"
  };

  // Guarda el id del producto y de su categoría actualmente visibles.
  // A futuro, este es el valor que se mandaría al servidor para
  // contar cuántas veces se escaneó el QR de cada pan.
  let productoActualId = null;
  let categoriaActualId = null;

  // ---------------------------------------------
  // 2. LA FUNCIÓN QUE PINTA UN PRODUCTO EN EL DOM
  // ---------------------------------------------
  function renderProduct(id) {
    const producto = productos[id];
    if (!producto) {
      console.warn('Producto no encontrado:', id);
      return;
    }

    productoActualId = id;
    categoriaActualId = producto.categoria; // ej. "Pan Dulce"

    document.getElementById('product-image').src = producto.imagen;
    document.getElementById('product-image').alt = producto.nombre;
    document.getElementById('product-name').textContent = producto.nombre;
    document.getElementById('product-category').textContent = `Categoría: ${producto.categoria}`;
    document.getElementById('product-description').textContent = producto.descripcion;

    // El precio es opcional: si el producto no lo trae, se oculta esa línea.
    const precioLi = document.getElementById('precio');
    if (producto.precio) {
      precioLi.textContent = producto.precio;
      precioLi.style.display = '';
    } else {
      precioLi.style.display = 'none';
    }

    // Reconstruye la lista de ingredientes (puede variar en cantidad)
    const lista = document.getElementById('ingredientes-lista');
    lista.querySelectorAll('li:not(.precio)').forEach(li => li.remove());
    producto.ingredientes.forEach(ing => {
      const li = document.createElement('li');
      li.textContent = ing;
      lista.insertBefore(li, precioLi); // el precio siempre queda al final
    });

    // NOTA (a futuro, no ahora): aquí es donde se mandaría al servidor
    // el conteo de escaneo, algo como:
    // fetch(`/api/escaneos?producto=${productoActualId}`, { method: 'POST' });
  }

  // ---------------------------------------------
  // 3. LEER EL ID DE PRODUCTO DESDE LA URL
  //    Ejemplo real de QR: https://tusitio.com/producto.html?producto=concha
  // ---------------------------------------------
  function obtenerIdDesdeURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get(PARAM_URL);
  }

  // Actualiza la URL sin recargar la página, para que sea
  // compartible/copiable y refleje el producto que se está viendo.
  function actualizarURL(id) {
    const url = new URL(window.location);
    url.searchParams.set(PARAM_URL, id);
    history.pushState({ producto: id }, '', url);
  }

  // ---------------------------------------------
  // 4. CONECTAR LOS BOTONES DE CROSS-NAVIGATION
  // ---------------------------------------------
  document.querySelectorAll('.cross-nav-card').forEach(card => {
    card.addEventListener('click', () => {
      const categoria = card.dataset.category;
      const idProducto = categoriaAProducto[categoria];
      if (idProducto) {
        renderProduct(idProducto);
        actualizarURL(idProducto);
      }
    });
  });

  // Soporta el botón de "atrás/adelante" del navegador
  window.addEventListener('popstate', () => {
    const id = obtenerIdDesdeURL() || PRODUCTO_POR_DEFECTO;
    renderProduct(id);
  });

  // ---------------------------------------------
  // 5. PRODUCTO INICIAL: viene del QR / de la URL,
  //    o si no hay ninguno, se usa uno por defecto.
  // ---------------------------------------------
  const idInicial = obtenerIdDesdeURL() || PRODUCTO_POR_DEFECTO;
  renderProduct(idInicial);
  actualizarURL(idInicial);
</script>

</body>
</html>
